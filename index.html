<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUFF LIKE FREE FIRE - CYBER SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-fire"></i> BUFF LIKE FF</h1>
            <p>[ CYBERPUNK VIP SYSTEM ]</p>
        </div>

        <div style="display: flex; background: #020604; border-bottom: 1px solid rgba(0, 255, 102, 0.3);">
            <button class="nav-btn active" id="tabBuffBtn" onclick="switchTab('buffTab', this)" style="flex:1; padding:12px; background:rgba(0,255,102,0.1); border:none; color:#00ff66; font-weight:700; cursor:pointer;">BUFF LIKE</button>
            <button class="nav-btn" id="tabAdminBtn" onclick="switchTab('adminTab', this)" style="flex:1; padding:12px; background:transparent; border:none; color:#666; font-weight:700; cursor:pointer;">ADMIN KEY</button>
        </div>

        <div class="content">
            <!-- TAB BUFF -->
            <div id="buffTab" class="section active">
                <div class="form-group">
                    <label>Tên Nhân Vật Ingame</label>
                    <input type="text" id="ign" class="form-control" placeholder="> Nhập tên nhân vật...">
                </div>

                <div class="form-group">
                    <label>ID Free Fire (8 Số)</label>
                    <input type="text" id="ffid" class="form-control" placeholder="> Nhập ID 8 số..." maxlength="8">
                </div>

                <div class="packages-title">Chọn Gói Buff Like:</div>
                <div class="packages-grid">
                    <div class="package-card active" onclick="selectPackage(50, this)">
                        <h3>+50 LIKE</h3>
                        <span>MIỄN PHÍ</span>
                    </div>
                    <div class="package-card" onclick="selectPackage(200, this)">
                        <h3>+200 LIKE</h3>
                        <span>KEY VIP</span>
                    </div>
                </div>

                <button class="btn-main" onclick="handleBuff()">TIẾN HÀNH BUFF LIKE</button>
            </div>

            <!-- TAB ADMIN -->
            <div id="adminTab" class="section" style="display:none;">
                <div id="adminLoginBox">
                    <div class="form-group">
                        <label>Tài Khoản Admin</label>
                        <input type="text" id="admUser" class="form-control" placeholder="> Username">
                    </div>
                    <div class="form-group">
                        <label>Mật Khẩu Admin</label>
                        <input type="password" id="admPass" class="form-control" placeholder="> Password">
                    </div>
                    <button class="btn-main" onclick="loginAdmin()">ĐĂNG NHẬP ADMIN</button>
                </div>

                <div id="adminDashboard" style="display: none;">
                    <div class="form-group">
                        <label>Thời Hạn Key VIP</label>
                        <select id="newKeyDuration" class="form-control">
                            <option value="1">1 Giờ</option>
                            <option value="24">1 Ngày</option>
                            <option value="168">7 Ngày</option>
                            <option value="720">30 Ngày</option>
                        </select>
                    </div>
                    <button class="btn-main" onclick="createAdminKey()">TẠO KEY VIP MỚI</button>

                    <div class="key-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>VIP Key</th>
                                    <th>Hạn dùng</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="keyListBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NHẬP KEY VIP -->
    <div class="modal" id="vipModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeVipModal()">&times;</button>
            <h3 style="color:var(--hacker-green);margin-bottom:15px;text-align:center;">XÁC THỰC VIP KEY</h3>
            
            <div class="form-group">
                <label>Vui lòng nhập Key VIP (16 Ký Tự)</label>
                <input type="text" id="vipKeyInput" class="form-control" placeholder="> VIP-XXXX-XXXX-XXXX">
                <div class="link4m-hint">
                    Không có Key? <span class="link4m-btn" onclick="generateLink4mKey()">Tạo Link Get Key Ngay</span>
                </div>
            </div>

            <button class="btn-main" onclick="verifyAndBuff200()">XÁC NHẬN BUFF 200 LIKE</button>

            <div style="margin-top:15px; border-top:1px solid #1a3322; padding-top:10px; text-align:center; font-size:11px;">
                <p style="color:#888; margin-bottom:6px;">Hỗ trợ liên hệ Admin:</p>
                <a href="https://t.me/thinhdz_9" target="_blank" style="color:#00ff66; margin-right:10px; text-decoration:none;">Telegram</a>
                <a href="https://discord.gg/ysFMKgHwPf" target="_blank" style="color:#00ff66; text-decoration:none;">Discord</a>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <!-- Gọi file script.js riêng biệt -->
    <script src="script.js"></script>
</body>
</html>
